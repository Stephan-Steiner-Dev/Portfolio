<section class="section-main">
    <div class="above-the-fold">
        <div class="upper-half">
            <div class="top-left">
                <button class="btn">
                    <span class="btn__text btn__text--default">Hello world</span>
                    <span class="btn__text btn__text--hover">I’M STEPHAN STEINER</span>
                    <img src="assets/images/content/waving_hand.png" alt="👋" class="btn__icon">
                </button>
                <div>
                    <ng-container *ngFor="let char of firstLetters; let i = index">
                        <span class="letter" [ngClass]="char === char.toLowerCase() ? 'lower' : 'upper'">
                            {{ char }}
                        </span>
                    </ng-container>
                </div>
            </div>
            <div (mouseover)="isHovered = true" (mouseleave)="isHovered = false" 
            [ngStyle]="{ filter: isHovered ? 'grayscale(0%)' : 'grayscale(100%)',transition: '0.3s ease'}" class="user-image-div">
                <img class="user-image" src="assets/images/content/user-image.png" alt="user-image">
                <p>Stephan {{ isHovered ? ':D' : ':)' }}</p>
            </div>
        </div>
        <div class="lower-half">
            <div class="bottom-div">
                <ng-container *ngFor="let char of secondLetters; let i = index">
                    <span class="letter" [ngClass]="char === char.toLowerCase() ? 'lower' : 'upper'">
                        {{ char }}
                    </span>
                </ng-container>
            </div>
            <a href="#sectionContact"><button>{{ 'ABOVE_THE_FOLD.CONTACT' | translate }}</button></a>
        </div>
    </div>
    <div class="contacts">
        <a href="https://www.linkedin.com/in/stephan-steiner-a22b4b380" target="_blank">
            <img src="assets/icons/linkedIn-icon.png" alt="linkedIn">
        </a>

        <a href="https://github.com/Stephan-Steiner-Dev" target="_blank">
            <img src="assets/icons/github-icon.png" alt="gitHub">
        </a>

        <a href="mailto:stephan-steiner-dev@proton.de" target="_blank">
            <img src="assets/icons/mail-icon.png" alt="mail">
        </a>
    </div>
</section>
