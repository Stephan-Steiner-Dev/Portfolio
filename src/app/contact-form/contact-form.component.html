<section class="section-contact" id="sectionContact">
    <div class="contact">
        <div class="contact-container">
            <div class="left-content" *ngFor="let item of content">
                <div>
                    <div>{{ 'CONTACT.TITLE' | translate }}</div>
                    <div>{{ 'CONTACT.SUBTITLE' | translate }}</div>
                </div>
                <div>
                    <div [innerHTML]="item.contactText"></div>
                </div>
                <div class="arrow-container">
                    <img [src]="item.img" class="arrow" alt="arrow">
                </div>
            </div>
            <div class="right-content">
                <app-formfield></app-formfield>
            </div>
        </div>
    </div>
    <app-footer></app-footer>
</section>
